name: Publish

on:
  push:
    branches:
      - main

permissions:
  contents: read
  
env:
  AWS_REGION: eu-west-2
  AWS_ACCOUNT_ID: "094954420758"

jobs:
  build:
    name: CDP-build-workflow
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      packages: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0
      - name: Setup dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 #v6.0.0
        with:
          dotnet-version: |
            10.0
      - name: Update NuGet.config
        run: |
          dotnet nuget remove source defra
          dotnet nuget add source --username USERNAME --password ${{ env.GITHUB_TOKEN }} --store-password-in-clear-text --name defra "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --configfile NuGet.config
      - name: Run unit tests
        run: |
          dotnet test --filter "Category!=IntegrationTest"
      - name: Run integration tests
        run: |
          docker compose up -d
          dotnet test --filter "Category=IntegrationTest"
      - name: Build and Publish
        uses: DEFRA/cdp-build-action/build@dfb527d1bca7591fbbfd32ac007557745e888cf2
        with:
          github-token: ${{ env.GITHUB_TOKEN }}
      - name: Pack NuGets
        run: |
          echo "Building a stable release package"
          dotnet pack --configuration Release -o ./nupkg
      - name: Publish NuGets
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key ${{ env.GITHUB_TOKEN }} \
            --skip-duplicate
  sonarcloud-scan:
    name: CDP SonarCloud Scan
    permissions:
      id-token: write
      pull-requests: write
      contents: read
      packages: read
    uses: ./.github/workflows/sonarcloud.yml
    needs: build
    secrets: inherit
